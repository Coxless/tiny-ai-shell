[package]
name = "ta"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ta"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
reqwest     = { version = "0.12", features = ["json", "stream"] }
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
regex       = "1"
crossterm   = "0.27"
futures-util = "0.3"
anyhow       = "1"

[dev-dependencies]
mockito = "1"
